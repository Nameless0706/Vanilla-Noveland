<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="noveland-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="55%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="icon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#020617" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#noveland-grad)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Centered Book Icon -->
  <g transform="translate(14, 14) scale(1.5)" filter="url(#icon-shadow)">
    <!-- Left Page -->
    <path
      d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"
      fill="rgba(255, 255, 255, 0.15)"
      stroke="#ffffff"
      stroke-width="2.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Right Page -->
    <path
      d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"
      fill="rgba(255, 255, 255, 0.15)"
      stroke="#ffffff"
      stroke-width="2.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Page lines detail -->
    <path
      d="M5 8h4M5 12h4"
      stroke="#ffffff"
      stroke-width="1.6"
      stroke-linecap="round"
      opacity="0.85"
    />
    <path
      d="M15 8h4M15 12h4"
      stroke="#ffffff"
      stroke-width="1.6"
      stroke-linecap="round"
      opacity="0.85"
    />
  </g>
</svg>
